<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="موقع الشركة">
  <meta name="theme-color" content="#ffffff">
  <title>esam</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#20251f;background:#fff;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:96px}
    body{margin:0;background:#fff;color:#20251f}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .header{width:min(1200px,calc(100% - 48px));min-height:88px;margin:auto;display:flex;align-items:center;gap:clamp(14px,2vw,28px);direction:rtl;border-bottom:1px solid #eceeea}
    .menu-button{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border:1px solid #e7e9e4;border-radius:10px;background:#fff;color:#20251f;cursor:pointer}
    .menu-button svg{width:21px;height:21px}
    .brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:20px;font-weight:800;flex:0 0 auto}
    .brand-mark{width:35px;height:35px;border-radius:10px;background:#20251f;color:#fff;display:grid;place-items:center}
    .brand-mark svg{width:22px;height:22px}
    .nav{display:flex;align-items:center;justify-content:flex-start;gap:clamp(12px,2vw,27px);flex:1;min-width:0;color:#5c625a;font-size:14px}
    .nav.closed{display:none}
    .nav a{white-space:nowrap;padding:9px 0;border-bottom:2px solid transparent}
    .nav a:hover,.nav a.active{color:#20251f;border-bottom-color:#20251f}
    .actions{display:flex;align-items:center;gap:9px;flex:0 0 auto}
    .talk{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 16px;background:#20251f;color:#fff;border:1px solid #20251f;font-weight:700;font-size:13px;white-space:nowrap}
    .language{padding:8px 11px;border:1px solid #e7e9e4;border-radius:999px;background:#fff;color:#20251f;font-size:12px;cursor:pointer;white-space:nowrap}
    main{width:100%}
    .blank-section{height:76vh;min-height:390px;background:#fff;scroll-margin-top:88px}
    footer{width:min(1200px,calc(100% - 48px));min-height:76px;margin:auto;border-top:1px solid #eceeea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#555;font-size:12px;padding:16px 0}
    .footer-socials{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 18px}
    .footer-socials a{display:inline-flex;align-items:center;gap:5px;color:#353a34;white-space:nowrap}
    .footer-socials a:hover{text-decoration:underline}
    .footer-socials a span{color:#858a82;font-size:11px}
    .copyright{display:block;color:#686d65}
    @media(max-width:720px){footer{width:calc(100% - 30px)}.footer-socials{gap:10px 14px}.footer-socials a{font-size:11px}}
    @media(max-width:880px){.header{gap:12px}.brand{font-size:17px}.nav{gap:12px;font-size:13px}.actions{gap:6px}.talk{padding:9px 12px}}
    @media(max-width:720px){
      .header{width:calc(100% - 30px);min-height:76px;position:relative;flex-wrap:wrap;justify-content:space-between;gap:9px;padding:12px 0}
      .menu-button{order:0}
      .brand{order:1;margin-inline-start:auto}
      .actions{order:2}
      .nav{display:none;order:3;position:absolute;top:68px;right:0;left:0;z-index:10;flex:1 1 100%;flex-direction:column;align-items:stretch;gap:0;padding:8px 16px;border:1px solid #e7e9e4;border-radius:13px;background:#fff;box-shadow:0 12px 28px #0000000a}
      .nav.open{display:flex}
      .nav.closed{display:none}
      .nav a{padding:11px 0;border-bottom:1px solid #f0f1ee}
      .nav a:last-child{border-bottom:0}
      footer{width:calc(100% - 30px)}
      .blank-section{height:76vh;min-height:340px}
    }
    @media(max-width:380px){.brand{font-size:15px;gap:7px}.brand-mark{width:31px;height:31px}.talk{padding:8px 10px;font-size:12px}.language{padding:7px 9px}}
  </style>
</head>
<body>
  <header class="header">
    <button class="menu-button" id="menuButton" type="button" aria-label="فتح القائمة" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#top" aria-label="الصفحة الرئيسية">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 17 10 5l4 8 2-4 4 8H4Z"/><path d="M7 20h10"/></svg></span>
      <span data-ar="اسم الشركة" data-en="Company name">اسم الشركة</span>
    </a>
    <nav class="nav" id="navigation" aria-label="التنقل الرئيسي">
      <a href="#about" data-ar="عن الشركة" data-en="About">عن الشركة</a>
      <a href="#services" data-ar="خدماتنا" data-en="Services">خدماتنا</a>
      <a href="#work" data-ar="أعمالنا" data-en="Our work">أعمالنا</a>
      <a href="#impact" data-ar="إنجازاتنا" data-en="Achievements">إنجازاتنا</a>
    </nav>
    <div class="actions">
      <a class="talk" href="#contact" data-ar="لنتحدث ↗" data-en="Let's talk ↗">لنتحدث ↗</a>
      <button class="language" id="languageButton" type="button">EN ↗</button>
    </div>
  </header>
  <main id="top">
    <section class="blank-section" id="about" aria-label="عن الشركة"></section>
    <section class="blank-section" id="services" aria-label="خدماتنا"></section>
    <section class="blank-section" id="work" aria-label="أعمالنا"></section>
    <section class="blank-section" id="impact" aria-label="إنجازاتنا"></section>
    <section class="blank-section" id="contact" aria-label="لنتحدث"></section>
  </main>
  <footer class="footer">
    <div class="footer-socials" aria-label="حسابات التواصل الاجتماعي">
      <a href="https://instagram.com/yourcompany" target="_blank" rel="noopener noreferrer" aria-label="Instagram">Instagram <span>@yourcompany</span></a>
      <a href="https://snapchat.com/add/yourcompany" target="_blank" rel="noopener noreferrer" aria-label="Snapchat">Snapchat <span>@yourcompany</span></a>
      <a href="https://youtube.com/@yourcompany" target="_blank" rel="noopener noreferrer" aria-label="YouTube">YouTube <span>@yourcompany</span></a>
      <a href="https://tiktok.com/@yourcompany" target="_blank" rel="noopener noreferrer" aria-label="TikTok">TikTok <span>@yourcompany</span></a>
      <a href="https://x.com/yourcompany" target="_blank" rel="noopener noreferrer" aria-label="X">X <span>@yourcompany</span></a>
      <a href="https://wa.me/966500000000" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">WhatsApp <span dir="ltr">+966 50 000 0000</span></a>
    </div>
    <span class="copyright" data-ar="© 2026 جميع الحقوق محفوظة." data-en="© 2026 All rights reserved.">© 2026 جميع الحقوق محفوظة.</span>
  </footer>
  <script>
    (() => {
      const root = document.documentElement;
      const navigation = document.getElementById("navigation");
      const menuButton = document.getElementById("menuButton");
      const languageButton = document.getElementById("languageButton");
      let language = "ar";
      const setLanguage = next => {
        language = next;
        root.lang = language;
        root.dir = language === "ar" ? "rtl" : "ltr";
        document.querySelectorAll("[data-ar][data-en]").forEach(element => {
          element.textContent = element.dataset[language];
        });
        languageButton.textContent = language === "ar" ? "EN ↗" : "العربية ↗";
        const menuOpen = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-label", language === "ar" ? (menuOpen ? "إغلاق القائمة" : "فتح القائمة") : (menuOpen ? "Close menu" : "Open menu"));
        document.title = language === "ar" ? "اسم الشركة" : "Company name";
      };
      menuButton.addEventListener("click", () => {
        const mobile = window.innerWidth <= 720;
        const wasOpen = mobile ? navigation.classList.contains("open") : !navigation.classList.contains("closed");
        const shouldOpen = !wasOpen;
        if (mobile) navigation.classList.toggle("open", shouldOpen);
        else navigation.classList.toggle("closed", !shouldOpen);
        menuButton.setAttribute("aria-expanded", String(shouldOpen));
        menuButton.setAttribute("aria-label", language === "ar" ? (shouldOpen ? "إغلاق القائمة" : "فتح القائمة") : (shouldOpen ? "Close menu" : "Open menu"));
      });
      navigation.querySelectorAll("a").forEach(link => link.addEventListener("click", () => {
        navigation.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      }));
      languageButton.addEventListener("click", () => setLanguage(language === "ar" ? "en" : "ar"));
      window.addEventListener("resize", () => {
        if (window.innerWidth > 720) {
          navigation.classList.remove("open", "closed");
          menuButton.setAttribute("aria-expanded", "false");
        }
      });
      const sections = [...document.querySelectorAll(".blank-section")];
      const updateActiveLink = () => {
        const hash = location.hash;
        document.querySelectorAll(".nav a").forEach(link => link.classList.toggle("active", link.getAttribute("href") === hash));
      };
      window.addEventListener("hashchange", updateActiveLink);
      setLanguage("ar");
      updateActiveLink();
    })();
  </script>
</body>
</html>
